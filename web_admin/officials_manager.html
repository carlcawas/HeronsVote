<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officials Manager</title>
    <style>
        :root { --primary: #02569B; --bg: #f0f2f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* NAV BAR */
        .nav-bar { background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-link { text-decoration: none; color: #666; font-weight: bold; font-size: 14px; padding-bottom: 2px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .nav-title { margin-right: auto; font-weight: 900; color: #333; text-transform: uppercase; letter-spacing: 1px; }

        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 60px; resize: vertical; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        #btnSave { background: var(--primary); }
        #btnClear { background: #757575; }
        
        .official-item { border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .official-item:hover { background-color: #fafafa; }
        .official-actions { display: flex; flex-direction: column; gap: 5px; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: 70px; }
        .btn-edit { background: #f57c00; }
        .btn-del { background: #d32f2f; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-title">Admin Panel</div>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="candidate_manager.html" class="nav-link">Candidates</a>
    <a href="college_manager.html" class="nav-link">Colleges</a>
    <a href="election_manager.html" class="nav-link">Elections</a>
    <a href="slate_manager.html" class="nav-link">Slates</a>
    <a href="results.html" class="nav-link">Results</a>
    <a href="proposal_manager.html" class="nav-link">Proposals</a>
    <a href="announcements_manager.html" class="nav-link">Announcements</a>
    <a href="officials_manager.html" class="nav-link active">Officials</a>
</div>

<div class="container">
    <!-- LEFT: FORM -->
    <div class="card">
        <h2>Manage Official</h2>
        <input type="hidden" id="docId">
        
        <div class="form-group">
            <label>Organization Context (Where to save?)</label>
            <select id="org_context" onchange="loadOfficials()">
                <option value="">Loading Contexts...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="e.g. John Doe">
        </div>

        <div class="form-group">
            <label>Position / Role</label>
            <select id="position">
                <option value="Chairperson">Chairperson</option>
                <option value="Vice Chairperson">Vice Chairperson</option>
                <option value="Secretary">Secretary</option>
                <option value="Treasurer">Treasurer</option>
                <option value="Auditor">Auditor</option>
                <option value="President">President (USC)</option>
                <option value="Vice President">Vice President (USC)</option>
                <!-- Add more USC roles as needed -->
            </select>
        </div>

        <div class="form-group">
            <label>Year Level</label>
            <input type="text" id="year" placeholder="e.g. 4th Year">
        </div>

        <div class="form-group">
            <label>Platform / Bio</label>
            <textarea id="platform" placeholder="Description..."></textarea>
        </div>

        <div class="form-group">
            <label>Photo</label>
            <input type="file" id="imgFile" accept="image/*">
            <input type="hidden" id="img">
            <div style="margin-top: 10px; min-height: 20px;">
                <img id="preview" src="" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; display: none; border: 1px solid #ddd;">
                <div id="uploadStatus" style="font-size: 12px; color: #666; margin-top: 5px;"></div>
            </div>
        </div>

        <div class="btn-row">
            <button id="btnClear" onclick="clearForm()">Clear Form</button>
            <button id="btnSave" onclick="saveOfficial()">Save Official</button>
        </div>
    </div>

    <!-- RIGHT: LIST -->
    <div class="card">
        <h2>Current Officials</h2>
        <button onclick="loadOfficials()" style="width:100%; background:#00897b; margin-bottom:15px; color:white; padding:10px; border:none; border-radius:4px; cursor:pointer;">Refresh List</button>
        <div id="listArea">Select an organization to view officials.</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbOXynjC4MVIwbpz67DsJLdWS0RCXk7bY",
        authDomain: "heronsvote.firebaseapp.com",
        projectId: "heronsvote",
        storageBucket: "heronsvote.firebasestorage.app",
        messagingSenderId: "510958334373",
        appId: "1:510958334373:web:30058b8235281b084cf84c",
        measurementId: "G-2VFRY4RN46"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // SUPABASE CONFIG
    const supabaseUrl = "https://gbmfnuhporizglpzeeji.supabase.co"; 
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdibWZudWhwb3JpemdscHplZWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTk1MjAsImV4cCI6MjA3ODUzNTUyMH0.cCI7u2uJLDh6WKQWev3bWIv3lt2OrbBWsS_PQiHHcEM";
    let supabase = null;
    try {
        if (supabaseUrl && supabaseUrl.startsWith("http")) {
             supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        }
    } catch (err) { console.error(err); }

    let selectedFile = null;
    let allOfficials = [];

    // CONSTANTS
    const COL_COLLEGES = "colleges";
    const COL_USC = "university_officials";

    window.onload = async () => {
        await loadOrganizationOptions();
    };

    // 1. Load USC + Colleges into Dropdown
    async function loadOrganizationOptions() {
        const select = document.getElementById('org_context');
        select.innerHTML = '<option value="">-- Select Organization --</option>';
        
        // Add USC
        select.innerHTML += '<option value="_USC_" style="font-weight:bold; color:#02569B;">★ University Student Council (USC)</option>';

        try {
            const snap = await getDocs(collection(db, COL_COLLEGES));
            snap.forEach(doc => {
                const d = doc.data();
                select.innerHTML += `<option value="${doc.id}">${d.name} (${doc.id})</option>`;
            });
        } catch (e) { console.error("Error loading colleges", e); }
    }

    // 2. Load Officials based on selection
    async function loadOfficials() {
        const contextId = document.getElementById('org_context').value;
        const listDiv = document.getElementById('listArea');
        
        if (!contextId) {
            listDiv.innerHTML = "Select an organization to view officials.";
            return;
        }

        listDiv.innerHTML = "Loading...";

        try {
            let snap;
            
            if (contextId === '_USC_') {
                // Fetch from root collection
                snap = await getDocs(collection(db, COL_USC));
            } else {
                // Fetch from subcollection: colleges/{id}/officials
                snap = await getDocs(collection(db, COL_COLLEGES, contextId, "officials"));
            }

            listDiv.innerHTML = "";
            if (snap.empty) {
                listDiv.innerHTML = "<p style='text-align:center; color:#999'>No officials found for this organization.</p>";
                return;
            }

            allOfficials = [];
            snap.forEach(doc => {
                const d = doc.data();
                allOfficials.push({ id: doc.id, ...d });

                // Image handling
                let imgUrl = "";
                if(d.img && supabase) {
                    const { data: pub } = supabase.storage.from('images').getPublicUrl(d.img);
                    imgUrl = pub.publicUrl;
                }

                const el = document.createElement('div');
                el.className = 'official-item';
                el.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        ${imgUrl ? `<img src="${imgUrl}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right:10px;">` : '<div style="width:40px; height:40px; background:#eee; border-radius:50%; margin-right:10px;"></div>'}
                        <div>
                            <h3 style="margin:0; font-size:16px;">${d.name}</h3>
                            <small style="color:#666;">${d.official_role || d.position || "Official"}</small>
                        </div>
                    </div>
                    <div class="official-actions">
                        <button class="btn-sm btn-edit" onclick="editOfficial('${doc.id}')">Edit</button>
                        <button class="btn-sm btn-del" onclick="deleteOfficial('${doc.id}')">Remove</button>
                    </div>
                `;
                listDiv.appendChild(el);
            });

        } catch (e) {
            console.error(e);
            listDiv.innerHTML = "Error loading list: " + e.message;
        }
    }

    // 3. Save Official
    async function saveOfficial() {
        const contextId = document.getElementById('org_context').value;
        if (!contextId) return alert("Please select an organization context.");

        const docId = document.getElementById('docId').value;
        const name = document.getElementById('name').value;
        const position = document.getElementById('position').value;
        const year = document.getElementById('year').value;
        const platform = document.getElementById('platform').value;
        let imgPath = document.getElementById('img').value;

        if(!name) return alert("Name is required.");

        try {
            // Upload Image if changed
            if (selectedFile && supabase) {
                const statusEl = document.getElementById('uploadStatus');
                statusEl.innerText = "Uploading image...";
                
                if (imgPath) await supabase.storage.from('images').remove([imgPath]);

                const fileName = `${Date.now()}_${selectedFile.name.replace(/\s+/g, '-')}`;
                const fullPath = `official_pics/${fileName}`; // Separate folder for officials? Or reuse candidate_pics
                const { error: upErr } = await supabase.storage.from('images').upload(fullPath, selectedFile);
                if (upErr) throw upErr;
                imgPath = fullPath;
            }

            // Determine Reference
            let ref;
            let newId = docId;
            
            // Define Collection Logic
            if (contextId === '_USC_') {
                if (docId) ref = doc(db, COL_USC, docId);
                else {
                    ref = doc(collection(db, COL_USC));
                    newId = ref.id;
                }
            } else {
                if (docId) ref = doc(db, COL_COLLEGES, contextId, "officials", docId);
                else {
                    ref = doc(collection(db, COL_COLLEGES, contextId, "officials"));
                    newId = ref.id;
                }
            }

            const data = {
                name,
                official_role: position, // Explicitly naming it official_role to distinguish
                position: position,      // Keep position for compatibility
                year,
                platform,
                img: imgPath,
                updatedAt: new Date().toISOString()
            };

            await setDoc(ref, data, { merge: true });
            alert("Official Saved!");
            clearForm();
            loadOfficials(); // Refresh list

        } catch (e) {
            alert("Error saving: " + e.message);
        }
    }

    // 4. Delete
    async function deleteOfficial(id) {
        if (!confirm("Remove this official?")) return;
        const contextId = document.getElementById('org_context').value;
        
        try {
            if (contextId === '_USC_') {
                await deleteDoc(doc(db, COL_USC, id));
            } else {
                await deleteDoc(doc(db, COL_COLLEGES, contextId, "officials", id));
            }
            
            loadOfficials();
            if(document.getElementById('docId').value === id) clearForm();
        } catch (e) {
            alert("Error deleting: " + e.message);
        }
    }

    // 5. Edit Helper
    window.editOfficial = (id) => {
        const data = allOfficials.find(o => o.id === id);
        if (!data) return;

        document.getElementById('docId').value = id;
        document.getElementById('name').value = data.name || "";
        // Prefer official_role, fallback to position
        document.getElementById('position').value = data.official_role || data.position || "Chairperson";
        document.getElementById('year').value = data.year || "";
        document.getElementById('platform').value = data.platform || "";
        document.getElementById('img').value = data.img || "";
        
        // Preview
        const preview = document.getElementById('preview');
        if (data.img && supabase) {
            const { data: pub } = supabase.storage.from('images').getPublicUrl(data.img);
            preview.src = pub.publicUrl;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
        
        selectedFile = null;
        document.getElementById('imgFile').value = "";
        window.scrollTo(0,0);
    };

    // Image Input Listener
    const fileInput = document.getElementById('imgFile');
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);
        document.getElementById('uploadStatus').innerText = "Image selected.";
    });

    window.clearForm = () => {
        document.getElementById('docId').value = "";
        document.querySelectorAll('input:not([type="hidden"]), textarea').forEach(i => i.value = "");
        document.getElementById('img').value = "";
        document.getElementById('imgFile').value = "";
        document.getElementById('preview').style.display = 'none';
        document.getElementById('uploadStatus').innerText = "";
        selectedFile = null;
    };

    // Expose functions
    window.loadOfficials = loadOfficials;
    window.saveOfficial = saveOfficial;
    window.deleteOfficial = deleteOfficial;
</script>

</body>
</html>
