<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Manager</title>
    <style>
        :root { --primary: #00897b; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .nav-bar { background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-link { text-decoration: none; color: #666; font-weight: bold; font-size: 14px; padding-bottom: 2px; }
        .nav-link:hover { color: #02569B; }
        .nav-link.active { color: #02569B; border-bottom: 2px solid #02569B; }
        .nav-title { margin-right: auto; font-weight: 900; color: #333; text-transform: uppercase; letter-spacing: 1px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .actions button { width: auto; padding: 5px 10px; margin-left: 5px; font-size: 12px; }
        .btn-del { background: #d32f2f; }
        .btn-edit { background: #f57c00; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-title">Admin Panel</div>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="candidate_manager.html" class="nav-link">Candidates</a>
    <a href="college_manager.html" class="nav-link active">Colleges</a>
    <a href="election_manager.html" class="nav-link">Elections</a>
    <a href="slate_manager.html" class="nav-link">Slates</a>
    <a href="results.html" class="nav-link">Results</a>
</div>

<div class="container">
    <div class="card">
        <h2>Manage College</h2>
        <label>College ID</label><input type="text" id="col_id" placeholder="e.g. CCIS">
        <label>College Name</label><input type="text" id="col_name" placeholder="e.g. College of Computing...">
        <label>Dean's Name</label><input type="text" id="col_dean" placeholder="e.g. Dean John Doe">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="clearForm()" style="background:#757575">Clear</button>
            <button onclick="saveCollege()" id="btnSave">Save College</button>
        </div>
    </div>

    <div class="card">
        <h2>Existing Colleges</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button onclick="loadColleges()">Refresh List</button>
            <button onclick="bulkAddDefaults()" style="background-color: #2e7d32;">+ Bulk Add Defaults</button>
        </div>
        <div id="listArea">Loading...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbOXynjC4MVIwbpz67DsJLdWS0RCXk7bY",
        authDomain: "heronsvote.firebaseapp.com",
        projectId: "heronsvote",
        storageBucket: "heronsvote.firebasestorage.app",
        messagingSenderId: "510958334373",
        appId: "1:510958334373:web:30058b8235281b084cf84c",
        measurementId: "G-2VFRY4RN46"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COL_NAME = "colleges";

    window.onload = loadColleges;

    async function saveCollege() {
        const id = document.getElementById('col_id').value.trim();
        const name = document.getElementById('col_name').value.trim();
        const dean = document.getElementById('col_dean').value.trim();
        if(!id || !name) return alert("ID and Name required");
        try {
            await setDoc(doc(db, COL_NAME, id), { id, name, dean }, { merge: true });
            alert("Saved!"); clearForm(); loadColleges();
        } catch(e) { alert(e.message); }
    }

    async function loadColleges() {
        const listDiv = document.getElementById('listArea');
        const snap = await getDocs(collection(db, COL_NAME));
        listDiv.innerHTML = snap.empty ? "No colleges." : "";
        snap.forEach(d => {
            const data = d.data();
            const el = document.createElement('div');
            el.className = 'list-item';
            el.innerHTML = `
                <div><h3>${data.id} - ${data.name}</h3><small>Dean: ${data.dean||"N/A"}</small></div>
                <div class="actions">
                    <button class="btn-edit" onclick="fillForm('${d.id}', '${data.name}', '${data.dean||''}')">Edit</button>
                    <button class="btn-del" onclick="delCollege('${d.id}')">Delete</button>
                </div>`;
            listDiv.appendChild(el);
        });
    }

    async function bulkAddDefaults() {
        if(!confirm("Bulk add defaults?")) return;
        const colleges = {
            'CBFS': 'College of Business and Financial Science',
            'CCIS': 'College of Computing and Information Sciences',
            'CCSE': 'College of Construction Science and Engineering',
            'CET': 'College of Engineering Technology',
            'CHK': 'College of Human Kinetics',
            'CITE': 'College of Innovative Teacher Education',
            'CGPP': 'College of Governance and Public Policy',
            'CTHM': 'College of Tourism and Hospitality Management',
            'IAD': 'Institute of Arts and Design',
            'IIHS': 'Institute of Imaging Health Sciences',
            'IOA': 'Institute of Accountancy',
            'ION': 'Institute of Nursing',
            'IOP': 'Institute of Pharmacy',
            'IOPSY': 'Institute of Psychology',
            'ISW': 'Institute of Social Work',
            'IDEM': 'Institute of Disaster and Emergency Management',
        };
        const promises = Object.entries(colleges).map(([id, name]) => 
            setDoc(doc(db, COL_NAME, id), { id, name, dean: "" }, { merge: true }));
        await Promise.all(promises);
        alert("Done!"); loadColleges();
    }

    async function delCollege(id) {
        if(confirm("Delete " + id + "?")) { await deleteDoc(doc(db, COL_NAME, id)); loadColleges(); }
    }

    function fillForm(id, name, dean) {
        document.getElementById('col_id').value = id;
        document.getElementById('col_name').value = name;
        document.getElementById('col_dean').value = dean;
    }

    function clearForm() {
        document.getElementById('col_id').value = "";
        document.getElementById('col_name').value = "";
        document.getElementById('col_dean').value = "";
    }

    window.loadColleges = loadColleges;
    window.saveCollege = saveCollege;
    window.bulkAddDefaults = bulkAddDefaults;
    window.delCollege = delCollege;
    window.fillForm = fillForm;
    window.clearForm = clearForm;
</script>
</body>
</html>
