<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Election Analytics</title>
    <style>
        :root { --primary: #02569B; --bg: #f0f2f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* NAV BAR */
        .nav-bar { background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-link { text-decoration: none; color: #666; font-weight: bold; font-size: 14px; padding-bottom: 2px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .nav-title { margin-right: auto; font-weight: 900; color: #333; text-transform: uppercase; letter-spacing: 1px; }

        .container { max-width: 1000px; margin: 0 auto; }
        
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #333; }
        
        /* Election List Styles */
        .election-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .election-item:hover { background: #f5f5f5; }
        .election-item:last-child { border-bottom: none; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .badge.ongoing { background: #e8f5e9; color: #2e7d32; }
        .badge.closed { background: #eee; color: #666; }
        .badge.proposal { background: #e3f2fd; color: #02569B; }

        /* Analytics Grid */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-box { background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: #02569B; }
        
        /* UPDATED: Breakdown Styles */
        .year-breakdown { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        .year-chip { background: #f5f5f5; padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #eee; }
        .year-chip b { color: #02569B; }
        
        .abstain-card { border-left: 5px solid #757575; background: #fafafa; margin-bottom: 10px; padding: 15px; }
        .candidate-card { border-left: 5px solid #02569B; margin-bottom: 10px; padding: 15px; }
        .candidate-card h3, .abstain-card h3 { margin: 0; font-size: 16px; }
    </style>
</head>
<body>

<!-- NAVIGATION BAR -->
<div class="nav-bar">
    <div class="nav-title">Admin Panel</div>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="candidate_manager.html" class="nav-link">Candidates</a>
    <a href="college_manager.html" class="nav-link">Colleges</a>
    <a href="election_manager.html" class="nav-link">Elections</a>
    <a href="slate_manager.html" class="nav-link">Slates</a>
    <a href="results.html" class="nav-link active">Results</a>
</div>

<div class="container">
    
    <!-- ELECTION LIST -->
    <div class="card">
        <h2>Select Election / Proposal</h2>
        <div id="electionList">Loading data...</div>
    </div>

    <!-- DASHBOARD CONTENT (Hidden until selected) -->
    <div id="dashboardContent" style="display: none;">
        <h1 id="selectedElectionTitle" style="color: var(--primary);">Analytics</h1>
        
        <!-- GENERAL TURNOUT -->
        <div id="turnoutSection" class="card">
            <h2>Voter Turnout</h2>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-val" id="totalVotes">0</div>
                    <div>Votes Cast</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="eligibleVotes">Calculating...</div>
                    <div>Eligible Voters (Verified)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="turnoutPercent">0%</div>
                    <div>Turnout Rating</div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <strong>Turnout by Year Level:</strong>
                <div id="turnoutBreakdown" class="year-breakdown">Loading breakdown...</div>
            </div>
        </div>

        <!-- CANDIDATES RESULTS -->
        <div class="card">
            <h2 id="resultsHeader">Candidate Results</h2>
            <div id="candidatesList">Loading...</div>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, getDocs, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbOXynjC4MVIwbpz67DsJLdWS0RCXk7bY",
        authDomain: "heronsvote.firebaseapp.com",
        projectId: "heronsvote",
        storageBucket: "heronsvote.firebasestorage.app",
        messagingSenderId: "510958334373",
        appId: "1:510958334373:web:30058b8235281b084cf84c",
        measurementId: "G-2VFRY4RN46"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let unsubStats = null;
    let unsubCandidates = null;
    
    // Global stats variables
    let currentEligibleTotal = 0; 
    let eligibleByYear = {}; // Stores { "First Year": 150, "Second Year": 120 }

    window.onload = loadAllItems;

    async function loadAllItems() {
        const listDiv = document.getElementById('electionList');
        listDiv.innerHTML = "Loading...";
        
        try {
            // Fetch Elections & Proposals
            const electionsSnap = await getDocs(collection(db, "elections"));
            const proposalsSnap = await getDocs(collection(db, "proposals"));
            
            const items = [];

            electionsSnap.forEach(doc => {
                const d = doc.data();
                items.push({ id: doc.id, ...d, isProposal: false, college_id: d.college_id });
            });

            proposalsSnap.forEach(doc => {
                items.push({ id: doc.id, ...doc.data(), isProposal: true });
            });

            if (items.length === 0) {
                listDiv.innerHTML = "No elections or proposals found.";
                return;
            }

            // Sort by newest
            items.sort((a, b) => {
                const timeA = a.start?.seconds || 0;
                const timeB = b.start?.seconds || 0;
                return timeB - timeA; 
            });

            listDiv.innerHTML = "";
            
            items.forEach(d => {
                let statusClass, statusText, subText;

                if (d.isProposal) {
                    statusClass = 'proposal';
                    statusText = 'PROPOSAL';
                    subText = d.summary || "University Wide Proposal";
                } else {
                    statusClass = d.ongoing ? 'ongoing' : 'closed';
                    statusText = d.ongoing ? 'ONGOING' : 'CLOSED';
                    subText = `${d.type} | ID: ${d.id}`;
                }
                
                const div = document.createElement('div');
                div.className = 'election-item';
                
                const typeParam = d.isProposal ? 'proposal' : d.type;
                const collegeParam = d.college_id || ""; 
                
                div.onclick = () => selectElection(d.id, d.name, typeParam, collegeParam);
                
                div.innerHTML = `
                    <div>
                        <strong>${d.name || d.id}</strong><br>
                        <small style="color:#666">${subText}</small>
                    </div>
                    <span class="badge ${statusClass}">${statusText}</span>
                `;
                listDiv.appendChild(div);
            });

        } catch (e) {
            console.error(e);
            listDiv.innerHTML = "Error loading list.";
        }
    }

    // --- LOGIC FOR ELIGIBLE VOTERS (TOTAL + PER YEAR) ---
    async function calculateEligibleVoters(type, collegeId) {
        document.getElementById('eligibleVotes').innerText = "Calculating...";
        document.getElementById('turnoutBreakdown').innerText = "Calculating eligible voters...";
        
        eligibleByYear = {}; // Reset
        currentEligibleTotal = 0;

        try {
            const usersCol = collection(db, "users");
            
            // Define constraints
            let baseConstraints = [where("isVerified", "==", true)];
            if (type === 'college' && collegeId) {
                baseConstraints.push(where("college_id", "==", collegeId));
            }

            // 1. Calculate Total (One big query)
            const totalQ = query(usersCol, ...baseConstraints);
            const totalSnap = await getCountFromServer(totalQ);
            currentEligibleTotal = totalSnap.data().count;
            document.getElementById('eligibleVotes').innerText = currentEligibleTotal;

            // 2. Calculate Per Year (Looping queries)
            // These strings must match what is stored in your User Documents exactly
            const targetYears = ["First Year", "Second Year", "Third Year", "Fourth Year"]; 
            
            const promises = targetYears.map(async (year) => {
                const yearQ = query(usersCol, ...baseConstraints, where("year_level", "==", year));
                const snap = await getCountFromServer(yearQ);
                eligibleByYear[year] = snap.data().count;
            });

            await Promise.all(promises);
            
            // Trigger update to UI immediately in case votes loaded first
            refreshTurnoutUI(); 

        } catch (e) {
            console.error("Error counting users:", e);
            document.getElementById('eligibleVotes').innerText = "Error";
            document.getElementById('turnoutBreakdown').innerHTML = `<span style="color:red">Calculation Error (Check Index)</span>`;
        }
    }

    // Helper to refresh the Breakdown UI (Needs both Votes Data and Eligible Data)
    let lastVotesData = {}; // Cache latest votes from snapshot

    function refreshTurnoutUI() {
        // 1. Total Percentage
        const votesCast = parseInt(document.getElementById('totalVotes').innerText) || 0;
        if (currentEligibleTotal > 0) {
            const percent = ((votesCast / currentEligibleTotal) * 100).toFixed(1);
            document.getElementById('turnoutPercent').innerText = percent + "%";
        } else {
            document.getElementById('turnoutPercent').innerText = "0%";
        }

        // 2. Year Level Breakdown
        const votesByYear = lastVotesData.by_year_level || {};
        // Merge keys from both sources to ensure we show rows even if 0 votes
        const allYears = new Set([...Object.keys(votesByYear), ...Object.keys(eligibleByYear)]);
        
        let html = "";
        // Sort keys alphabetically
        Array.from(allYears).sort().forEach(year => {
            const voted = votesByYear[year] || 0;
            const eligible = eligibleByYear[year] || 0;
            
            let pctStr = "0%";
            if (eligible > 0) {
                pctStr = ((voted / eligible) * 100).toFixed(0) + "%";
            }

            // Render Chip: "1st Year: 10/100 - 10%"
            html += `
                <div class="year-chip">
                    ${year}: <b>${voted}/${eligible}</b> <span style="color:#666">- ${pctStr}</span>
                </div>
            `;
        });

        if (html === "") html = "No data yet.";
        document.getElementById('turnoutBreakdown').innerHTML = html;
    }

    window.selectElection = (electionId, name, type, collegeId) => {
        const isProposal = type === 'proposal';
        const collectionPath = isProposal ? "proposals" : "elections";

        // UI Setup
        document.getElementById('dashboardContent').style.display = 'block';
        document.getElementById('selectedElectionTitle').innerText = name || "Results";
        document.getElementById('resultsHeader').innerText = isProposal ? "Vote Breakdown" : "Candidate Results";
        document.getElementById('totalVotes').innerText = "...";
        document.getElementById('candidatesList').innerHTML = "Loading live data...";
        window.scrollTo(0, 200);

        // Reset Data
        lastVotesData = {};
        eligibleByYear = {};
        currentEligibleTotal = 0;

        // Cleanup
        if (unsubStats) unsubStats();
        if (unsubCandidates) unsubCandidates();

        // 1. START ELIGIBILITY CALCULATION
        calculateEligibleVoters(type, collegeId);

        // 2. LISTEN TO GENERAL STATS
        const generalRef = doc(db, collectionPath, electionId, "stats", "general");
        
        unsubStats = onSnapshot(generalRef, (doc) => {
            if(!doc.exists()) {
                document.getElementById('totalVotes').innerText = "0";
                lastVotesData = {};
                refreshTurnoutUI();
                return;
            }
            const data = doc.data();
            
            document.getElementById('totalVotes').innerText = data.total_votes_cast || 0;
            
            // Update cache and refresh UI
            lastVotesData = data; 
            refreshTurnoutUI();
        });

        // 3. LISTEN TO CANDIDATES / OPTIONS
        const statsColRef = collection(db, collectionPath, electionId, "stats");
        
        unsubCandidates = onSnapshot(statsColRef, (snap) => {
            const container = document.getElementById('candidatesList');
            container.innerHTML = "";

            const docs = snap.docs
                .map(d => d.data())
                .filter(d => d.name); // Filter out general doc
            
            // Sort by votes desc
            docs.sort((a,b) => (b.total_votes || 0) - (a.total_votes || 0));

            if (docs.length === 0) {
                container.innerHTML = "<p>No votes recorded yet.</p>";
                return;
            }

            docs.forEach(c => {
                if (!c.position && !isProposal) return; 

                const isAbstain = c.is_abstain === true;
                const div = document.createElement('div');
                div.className = isAbstain ? 'abstain-card' : 'candidate-card';
                
                let yearHtml = "";
                if(c.by_year_level) {
                    for(const [y, num] of Object.entries(c.by_year_level)) {
                        yearHtml += `<span style="margin-right:10px; font-size:11px; color:#666;">${y}: <b>${num}</b></span>`;
                    }
                }

                let subLabel = c.position;
                if (isProposal) subLabel = "Option";
                if (isAbstain) subLabel = "Abstain";

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <h3>${c.name}</h3>
                            <small style="color:#666; font-weight:bold; text-transform:uppercase;">${subLabel || ''}</small>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:24px; font-weight:bold; color:${isAbstain ? '#757575' : '#02569B'}">
                                ${c.total_votes || 0}
                            </div>
                            <small style="color:#999">votes</small>
                        </div>
                    </div>
                    <div style="margin-top:8px; border-top:1px solid #eee; padding-top:5px;">${yearHtml || "No breakdown data"}</div>
                `;
                container.appendChild(div);
            });
        });
    };
</script>
</body>
</html>
