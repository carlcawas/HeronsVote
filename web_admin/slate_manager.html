<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Manager</title>
    <style>
        :root { --primary: #02569B; --bg: #f0f2f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .nav-bar { background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-link { text-decoration: none; color: #666; font-weight: bold; font-size: 14px; padding-bottom: 2px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .nav-title { margin-right: auto; font-weight: 900; color: #333; text-transform: uppercase; letter-spacing: 1px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; margin-top: 10px; }
        #btnSave { background: var(--primary); }
        #btnClear { background: #757575; }
        .slate-item { border-bottom: 1px solid #eee; padding: 15px; display: flex; align-items: start; gap: 10px; }
        .slate-img { width: 50px; height: 50px; border-radius: 50%; background: #eee; object-fit: cover; }
        .slate-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .slate-info p { margin: 0; font-size: 12px; color: #666; }
        .actions { margin-left: auto; display: flex; flex-direction: column; gap: 5px; }
        .btn-sm { width: auto; padding: 5px 10px; font-size: 12px; }
        .btn-edit { background: #f57c00; }
        .btn-del { background: #d32f2f; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-title">Admin Panel</div>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="candidate_manager.html" class="nav-link">Candidates</a>
    <a href="college_manager.html" class="nav-link">Colleges</a>
    <a href="election_manager.html" class="nav-link">Elections</a>
    <a href="slate_manager.html" class="nav-link active">Slates</a>
</div>

<div class="container">
    <div class="card">
        <h2>Manage Slate</h2>
        <input type="hidden" id="docId">
        <input type="hidden" id="originalElectionId">
        
        <div class="form-group"><label>Slate Name</label><input type="text" id="name" placeholder="e.g. Gold Family"></div>
        
        <div class="form-group">
            <label>Election Context</label>
            <select id="election_id">
                <option value="">Loading Elections...</option>
            </select>
        </div>

        <div class="form-group"><label>Slogan</label><input type="text" id="slogan" placeholder="e.g. Stay Gold..."></div>
        <div class="form-group"><label>Platform</label><textarea id="platform" placeholder="General platform..."></textarea></div>
        <div class="form-group"><label>Advocacy</label><textarea id="advocacy" placeholder="Advocacies..."></textarea></div>
        
        <div class="form-group">
            <label>Slate Logo</label>
            <input type="file" id="imgFile" accept="image/*">
            <input type="hidden" id="img"> 
            <div style="margin-top: 10px; min-height: 20px;">
                <img id="preview" src="" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px; display: none; border: 1px solid #ddd;">
                <div id="uploadStatus" style="font-size: 12px; color: #666; margin-top: 5px;"></div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="btnClear" onclick="clearForm()">Clear</button>
            <button id="btnSave" onclick="saveSlate()">Save Slate</button>
        </div>
    </div>

    <div class="card">
        <h2>Existing Slates</h2>
        <button onclick="loadSlates()" style="background: #00897b; margin-bottom: 15px;">Refresh List</button>
        <div id="listArea">Loading...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbOXynjC4MVIwbpz67DsJLdWS0RCXk7bY",
        authDomain: "heronsvote.firebaseapp.com",
        projectId: "heronsvote",
        storageBucket: "heronsvote.firebasestorage.app",
        messagingSenderId: "510958334373",
        appId: "1:510958334373:web:30058b8235281b084cf84c",
        measurementId: "G-2VFRY4RN46"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const supabaseUrl = "https://gbmfnuhporizglpzeeji.supabase.co"; 
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdibWZudWhwb3JpemdscHplZWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTk1MjAsImV4cCI6MjA3ODUzNTUyMH0.cCI7u2uJLDh6WKQWev3bWIv3lt2OrbBWsS_PQiHHcEM";
    let supabase = null;
    try { if (supabaseUrl && supabaseUrl.startsWith("http")) supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } catch (err) {}
    
    const COL_SLATES = "slates";
    const COL_CANDIDATES = "candidates";
    const COL_ELECTIONS = "elections";
    let selectedFile = null; 

    const fileInput = document.getElementById('imgFile');
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedFile = file; 
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);
        document.getElementById('uploadStatus').innerText = "Image selected.";
    });

    window.onload = async () => {
        await loadElections();
        await loadSlates();
    };

    async function loadElections() {
        const select = document.getElementById('election_id');
        try {
            const snap = await getDocs(collection(db, COL_ELECTIONS));
            select.innerHTML = '<option value="">-- Select Election --</option>';
            snap.forEach(doc => {
                const d = doc.data();
                select.innerHTML += `<option value="${doc.id}">${d.name || doc.id}</option>`;
            });
        } catch (e) { console.error("Error loading elections:", e); }
    }

    async function loadSlates() {
        const listDiv = document.getElementById('listArea');
        listDiv.innerHTML = "Loading...";
        try {
            const snap = await getDocs(collection(db, COL_SLATES));
            listDiv.innerHTML = "";
            if (snap.empty) { listDiv.innerHTML = "No slates found."; return; }

            for (const d of snap.docs) {
                const data = d.data();
                let imgUrl = "";
                if(data.img && supabase) {
                    const { data: pub } = supabase.storage.from('images').getPublicUrl(data.img);
                    imgUrl = pub.publicUrl;
                }

                const membersSnap = await getDocs(collection(db, COL_SLATES, d.id, "candidates"));
                const memberCount = membersSnap.size;

                const el = document.createElement('div');
                el.className = 'slate-item';
                el.innerHTML = `
                    ${imgUrl ? `<img src="${imgUrl}" class="slate-img">` : '<div class="slate-img"></div>'}
                    <div class="slate-info">
                        <h3>${data.name}</h3>
                        <p><strong>${memberCount}</strong> Members</p>
                        <p><i>Election ID: ${data.election_id || "None"}</i></p>
                        <p style="font-size:11px; color:#888; margin-top:2px;">"${data.slogan || ''}"</p>
                    </div>
                    <div class="actions">
                        <button class="btn-sm btn-edit" onclick="editSlate('${d.id}')">Edit</button>
                        <button class="btn-sm btn-del" onclick="delSlate('${d.id}')">Delete</button>
                    </div>
                `;
                listDiv.appendChild(el);
            }
            window.allSlates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch (e) { listDiv.innerHTML = "Error loading slates."; }
    }

    async function saveSlate() {
        const docId = document.getElementById('docId').value;
        const oldElectionId = document.getElementById('originalElectionId').value;
        
        const name = document.getElementById('name').value;
        const electionId = document.getElementById('election_id').value;
        const slogan = document.getElementById('slogan').value;
        const platform = document.getElementById('platform').value;
        const advocacy = document.getElementById('advocacy').value;
        let imgPath = document.getElementById('img').value; 

        // Validation for required fields
        if (!name) return alert("Name required.");
        if (!electionId) return alert("Election context required.");
        if (!slogan) return alert("Slogan required.");
        if (!platform) return alert("Platform required.");
        if (!advocacy) return alert("Advocacy required.");

        try {
            // 1. Image Upload
            if (selectedFile && supabase) {
                if (imgPath) await supabase.storage.from('images').remove([imgPath]);
                const fileName = `${Date.now()}_${selectedFile.name.replace(/\s+/g, '-')}`;
                const fullPath = `slates_pics/${fileName}`;
                const { error: upErr } = await supabase.storage.from('images').upload(fullPath, selectedFile);
                if (upErr) throw upErr;
                imgPath = fullPath;
            }

            const data = { 
                name, slogan, platform, advocacy, 
                img: imgPath, 
                election_id: electionId 
            };

            const batch = writeBatch(db);

            // 2. Main Slate Doc
            let ref;
            let slateId;
            if (docId) {
                ref = doc(db, COL_SLATES, docId);
                slateId = docId;
                data.slate_id = docId;
            } else {
                ref = doc(collection(db, COL_SLATES));
                slateId = ref.id;
                data.slate_id = ref.id;
            }
            batch.set(ref, data, { merge: true });

            // 3. SYNC: Election Participation (Snapshot)
            
            // A. If moved elections, remove from old 'slates' subcollection
            if (oldElectionId && oldElectionId !== electionId) {
                batch.delete(doc(db, COL_ELECTIONS, oldElectionId, "slates", slateId));
                
                // B. CASCADING UPDATE: Move ALL candidates to new election
                const q = query(collection(db, COL_CANDIDATES), where("slate_id", "==", slateId));
                const candidates = await getDocs(q);
                candidates.forEach(c => {
                    // Update Candidate Doc
                    batch.update(c.ref, { election_id: electionId });
                    
                    // Remove from old election candidates
                    batch.delete(doc(db, COL_ELECTIONS, oldElectionId, "candidates", c.id));
                    
                    // Add to new election candidates
                    const newElecCand = doc(db, COL_ELECTIONS, electionId, "candidates", c.id);
                    const cData = c.data();
                    cData.election_id = electionId;
                    batch.set(newElecCand, cData);

                    // *** NEW: Update Candidate inside Slate Subcollection ***
                    const slateMemberRef = doc(db, COL_SLATES, slateId, "candidates", c.id);
                    batch.update(slateMemberRef, { election_id: electionId });
                });
            }

            // C. Add/Update in NEW election 'slates' subcollection
            // Syncing name, img, AND the new text fields to the snapshot
            batch.set(doc(db, COL_ELECTIONS, electionId, "slates", slateId), {
                name: name,
                img: imgPath,
                slogan: slogan,
                platform: platform,
                advocacy: advocacy,
                slate_id: slateId
            });

            await batch.commit();
            alert("Saved!");
            clearForm();
            loadSlates();
        } catch (e) { 
            console.error(e);
            alert("Error: " + e.message); 
        }
    }

    async function delSlate(id) {
        if (confirm("Delete this slate? Members will become Independent.")) {
            try {
                const slate = window.allSlates.find(s => s.id === id);
                const batch = writeBatch(db);
                
                // 1. Update all candidates to Independent
                const q = query(collection(db, COL_CANDIDATES), where("slate_id", "==", id));
                const snap = await getDocs(q);
                
                snap.forEach(docSnap => {
                    batch.update(docSnap.ref, {
                        slate_id: "",
                        slate: "Independent"
                    });
                });

                // 2. Delete from Elections ('slates' subcollection)
                if (slate && slate.election_id) {
                    batch.delete(doc(db, COL_ELECTIONS, slate.election_id, "slates", id));
                }

                // 3. Delete Slate Doc
                batch.delete(doc(db, COL_SLATES, id));

                await batch.commit();
                
                // 4. Delete Image
                if (slate && slate.img && supabase) {
                    await supabase.storage.from('images').remove([slate.img]);
                }

                loadSlates();
                if (document.getElementById('docId').value === id) clearForm();
            } catch(e) { alert("Error deleting: " + e.message); }
        }
    }

    function editSlate(id) {
        const data = window.allSlates.find(s => s.id === id);
        if (!data) return;
        document.getElementById('docId').value = id;
        document.getElementById('originalElectionId').value = data.election_id || "";
        
        document.getElementById('name').value = data.name || "";
        document.getElementById('election_id').value = data.election_id || "";
        document.getElementById('slogan').value = data.slogan || "";
        document.getElementById('platform').value = data.platform || "";
        document.getElementById('advocacy').value = data.advocacy || "";
        document.getElementById('img').value = data.img || ""; 
        
        const preview = document.getElementById('preview');
        if (data.img && supabase) {
            const { data: pub } = supabase.storage.from('images').getPublicUrl(data.img);
            preview.src = pub.publicUrl;
            preview.style.display = 'block';
        } else { preview.style.display = 'none'; }
        selectedFile = null;
    }

    function clearForm() {
        document.getElementById('docId').value = "";
        document.getElementById('originalElectionId').value = "";
        document.querySelectorAll('input, textarea, select').forEach(i => i.value = "");
        document.getElementById('preview').style.display = 'none';
        document.getElementById('uploadStatus').innerText = "";
        selectedFile = null;
    }

    window.loadSlates = loadSlates;
    window.saveSlate = saveSlate;
    window.delSlate = delSlate;
    window.editSlate = editSlate;
    window.clearForm = clearForm;
</script>
</body>
</html>
