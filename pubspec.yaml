name: heronsvote
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
    
  # For Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.4.4
  iconify_flutter: ^0.0.5

  #For TOTP - Google Authenticator
  http: ^1.2.2
  totp: ^0.1.0
  otp: ^3.1.1
  ntp: ^2.0.0
  flutter_secure_storage: ^9.0.0
  base32: ^2.1.3
  qr_flutter: any
  convert: ^3.0.1
  camera: ^0.11.0+1
  permission_handler: ^11.1.0
 
  google_mlkit_face_mesh_detection: ^0.4.1
  google_mlkit_commons: ^0.11.0

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/google_logo.png
    - assets/HeronVoteLogo.png
    - assets/HeronsVoteText.png
    - assets/verify.png
    - assets/verified.png
  fonts:  
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700