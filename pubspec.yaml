name: heronsvote
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  rxdart: ^0.27.7

  step_progress: ^2.7.0

  flutter_markdown: ^0.7.1
  
  # For Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.4.4
  iconify_flutter: ^0.0.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  pin_code_fields: ^8.0.1

  # For file opener
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  fluttertoast: ^8.2.4
  read_pdf_text: ^0.3.1

  # For camera hehe
  camera: ^0.11.0+1
  image: ^4.5.4
 
  google_mlkit_face_mesh_detection: ^0.4.1
  google_mlkit_commons: ^0.11.0

  flutter_svg: ^2.0.9

  # For dropdown boxes
  dropdown_button2: ^2.3.9
  supabase_flutter: ^2.10.3
  intl: ^0.20.2
   
  #percentages
  percent_indicator: ^4.2.3
  connectivity_plus: ^7.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  #for splash epekz
  shimmer: ^3.0.0

  flutter_launcher_icons: ^0.13.1

  # app icon
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/google_logo.png
    - assets/HeronVoteLogo.png
    - assets/HeronsVoteText.png
    - assets/BackButton.png
    - assets/error.svg
    - assets/verified.svg
    - assets/verify.svg
    - assets/back.svg
    - assets/account.svg
    - assets/announcement.svg
    - assets/bottom_nav/
    - assets/vote_verified.svg
    - assets/check.svg
    - assets/unverifiedIcon.svg
    - assets/circle_unverif.svg
    - assets/reverified.svg
    - assets/voting_process.png
    - assets/voting_rules.png
    - assets/legal/privacy_policy.md
    - assets/legal/terms_conditions.md

  fonts:  
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500